name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  shared:
    name: Trinity.Shared Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Trinity.Shared/Trinity.Shared.csproj

      - name: Build
        run: dotnet build Trinity.Shared/Trinity.Shared.csproj --no-restore

  teamserver:
    name: TeamServer Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TeamServer/TeamServer.csproj

      - name: Build
        run: dotnet build TeamServer/TeamServer.csproj --no-restore

  client:
    name: Client Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Client/Client.csproj

      - name: Build
        run: dotnet build Client/Client.csproj --no-restore

  tests:
    name: TeamServer.Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TeamServer.Tests/TeamServer.Tests.csproj

      - name: Build Tests
        run: dotnet build TeamServer.Tests/TeamServer.Tests.csproj --no-restore

      - name: Run Unit Tests
        run: dotnet test TeamServer.Tests/TeamServer.Tests.csproj --no-build --no-restore
