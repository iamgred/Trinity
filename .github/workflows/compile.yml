name: Compile

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build TeamServer/TeamServer.slnx --configuration Release
      - run: dotnet test TeamServer/TeamServer.Tests/TeamServer.Tests.csproj --configuration Release --no-build
      - run: dotnet build Client/Client.slnx --configuration Release
