[supervisord]
nodaemon=true
user=root

[program:api-relay-http]
# Tor connects to 127.0.0.1:18080; socat bridges that loopback socket to the
# ASP.NET container's internal port. Keep both endpoints aligned with torrc and
# compose.yaml when replacing the upstream application.
command=socat TCP-LISTEN:18080,fork,reuseaddr,bind=127.0.0.1 TCP:weather-api:8080
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tor]
# Tor starts after the relay so the hidden-service target is available when
# Tor begins accepting onion traffic.
command=tor -f /etc/tor/torrc
user=debian-tor
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
