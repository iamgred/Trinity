
services:
  tor:
    build:
      context: ./Tor
    container_name: onion-tor
    restart: unless-stopped
    # Tor's SOCKS listener is reachable only by containers on onion-internal.
    # Change this together with Tor/torrc if the Tor client port changes.
    expose:
      - "9050"
    volumes:
      - tor-state:/var/lib/tor
    networks:
      - onion-internal

  socks-proxy:
    build:
      context: ./SocksProxy
    container_name: onion-socks-proxy
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    # This is a Docker-internal TCP-to-SOCKS relay; it is not published to the
    # host. WEATHER_API_PROXY must use this service name and port.
    expose:
      - "1080"
    networks:
      - onion-internal

  weather-api:
    build:
      context: ./C2Server/WeatherForecastApi
    container_name: weather-api
    restart: unless-stopped
    environment:
      # Kestrel listens on every interface inside the container. The host
      # binding below controls whether the API is reachable from outside Docker.
      ASPNETCORE_URLS: http://+:8080
    ports:
      # Host loopback:container port. Keep loopback unless direct host access
      # is deliberately required; the onion route uses the internal network.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Health checks run inside this container, so localhost means port 8080
      # in the container rather than a host port.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - onion-internal

  redirector:
    build:
      context: ./Redirector
    container_name: onion-redirector
    restart: unless-stopped
    depends_on:
      socks-proxy:
        condition: service_healthy
      weather-api:
        condition: service_healthy
    environment:
      # Empty WEATHER_API_BASE selects the hostname generated by Tor. Set it
      # for another upstream application; do not include a trailing slash.
      WEATHER_API_BASE: ${WEATHER_API_BASE:-}
      # This path is appended to WEATHER_API_BASE by redirector.py.
      WEATHER_API_PATH: /weatherforecast
      # socks5h resolves onion names through the proxy instead of local DNS.
      WEATHER_API_PROXY: socks5h://socks-proxy:1080
      # Shared Tor volume containing the generated .onion hostname.
      ONION_HOSTNAME_FILE: /var/lib/tor/weather_api_hidden_service/hostname
    volumes:
      - tor-state:/var/lib/tor:ro
    ports:
      # The local entry point for clients. Change both this host port and any
      # client URLs if the redirector is moved to another host port.
      - "127.0.0.1:5000:5000"
    networks:
      - onion-internal

networks:
  onion-internal:
    driver: bridge

volumes:
  tor-state: